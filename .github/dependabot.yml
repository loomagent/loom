version: 2

# One pull request per ecosystem: module dependencies arrive as a single group, and the pinned
# actions as another. Dependabot cannot combine the two, so the most a run opens is two.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-modules:
        patterns:
          - "*"

  # Dependabot understands the commit pins and their trailing version comments, so an upgrade
  # arrives as a reviewed revision instead of a hash edited by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
