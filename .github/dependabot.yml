version: 2

updates:
  # The module's dependencies, read from go.mod. Each one lands as its own pull request, because a
  # library's dependency bumps are worth reading one at a time and a broken one can then be
  # reverted without touching the rest.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  # The actions both workflows run. They are pinned to a commit, and Dependabot understands the
  # pin and its trailing version comment, so an upgrade arrives as a reviewed revision instead of
  # a hash edited by hand. Grouped into one pull request: these bumps are mechanical, and they
  # either all keep working or all need the same look.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
