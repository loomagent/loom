name: Live provider tests

# These tests call real endpoints and spend real credit, so nothing here runs on a push or a
# pull request. `workflow_dispatch` and `schedule` both use this file from the default branch,
# so a branch cannot run modified workflow code with the repository's credentials, and a fork
# pull request never sees them at all.
#
# Secrets are the credentials. Endpoints and model lists are repository variables, because
# which models a credential may call is the operator's decision and can change without a commit.
# The credentials themselves live in the `live-providers` environment, so only a job that
# declares that environment receives them.
on:
  workflow_dispatch:

# Manual only, by decision: every run spends the configured models' credit and this repository
# does not want unattended spend. A schedule, if it is ever wanted, also wants an environment
# protection rule so the run waits for approval rather than spending on its own.

permissions:
  contents: read

concurrency:
  group: live-provider-tests

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-providers
    env:
      LOOM_LIVE_PROVIDERS: ${{ vars.LOOM_LIVE_PROVIDERS }}
      LOOM_LIVE_DEEPSEEK_URL: ${{ vars.LOOM_LIVE_DEEPSEEK_URL }}
      LOOM_LIVE_DEEPSEEK_KEY: ${{ secrets.LOOM_LIVE_DEEPSEEK_KEY }}
      LOOM_LIVE_DEEPSEEK_MODELS: ${{ vars.LOOM_LIVE_DEEPSEEK_MODELS }}
      LOOM_LIVE_ZHIPUAI_URL: ${{ vars.LOOM_LIVE_ZHIPUAI_URL }}
      LOOM_LIVE_ZHIPUAI_KEY: ${{ secrets.LOOM_LIVE_ZHIPUAI_KEY }}
      LOOM_LIVE_ZHIPUAI_MODELS: ${{ vars.LOOM_LIVE_ZHIPUAI_MODELS }}
      LOOM_LIVE_ARK_URL: ${{ vars.LOOM_LIVE_ARK_URL }}
      LOOM_LIVE_ARK_KEY: ${{ secrets.LOOM_LIVE_ARK_KEY }}
      LOOM_LIVE_ARK_MODELS: ${{ vars.LOOM_LIVE_ARK_MODELS }}
      LOOM_LIVE_OPENROUTER_URL: ${{ vars.LOOM_LIVE_OPENROUTER_URL }}
      LOOM_LIVE_OPENROUTER_KEY: ${{ secrets.LOOM_LIVE_OPENROUTER_KEY }}
      LOOM_LIVE_OPENROUTER_MODELS: ${{ vars.LOOM_LIVE_OPENROUTER_MODELS }}
    steps:
      # Pinned to a commit rather than a moving major tag: this job holds live credentials, so
      # what runs beside them should be a reviewed revision rather than whatever the tag points
      # to today.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Write the live configuration
        run: |
          umask 077
          env | grep '^LOOM_LIVE_' | sort > "$RUNNER_TEMP/live.env"
          # Mask only a value that is present, so an empty line shows that a credential did not
          # arrive instead of showing a placeholder for something that is not there.
          sed -E 's/^(_?LOOM_LIVE_[A-Z0-9]+_KEY)=.+$/\1=***/' "$RUNNER_TEMP/live.env"
      - name: Live provider tests
        run: LOOM_LIVE_ENV="$RUNNER_TEMP/live.env" go test ./livetest/ -v -timeout 25m
